services:
  # Backend Django API
  - type: web
    name: peergear-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn campusshare_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: campusshare_db
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"

  # Frontend Vite React Static Site
  - type: web
    name: peergear-frontend
    env: static
    buildCommand: "cd campusshare_frontend && npm install && npm run build"
    staticPublishPath: "./campusshare_frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
